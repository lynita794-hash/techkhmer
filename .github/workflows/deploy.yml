name: Deploy to VPS

# Runs on every push to main, or manually from the Actions tab.
# Builds the React frontend, then rsyncs:
#   - dist/ contents  -> htdocs/techkhmer.org  (static site root)
#   - server/ code    -> a separate folder OUTSIDE htdocs (never publicly served)
# then restarts the backend via PM2.
#
# IMPORTANT — required GitHub repo secrets (Settings > Secrets and
# variables > Actions):
#   DEPLOY_SSH_HOST      e.g. 123.45.67.89 or techkhmer.org
#   DEPLOY_SSH_USER      the CloudPanel site's SSH user (NOT root)
#   DEPLOY_SSH_KEY        private key (PEM) matching a public key already
#                         added to that user's ~/.ssh/authorized_keys
#   DEPLOY_SSH_PORT      optional, defaults to 22
#   DEPLOY_HTDOCS_PATH   e.g. /home/techkhmer/htdocs/techkhmer.org
#   DEPLOY_SERVER_PATH   e.g. /home/techkhmer/dramatv-server/server
#                         (must be OUTSIDE htdocs — see CLOUDPANEL_STATIC_FIX.md)
#
# Never commit server/.env — it's created once by hand on the VPS
# (step 4 of CLOUDPANEL_STATIC_FIX.md) and is excluded from every rsync
# below, so deploys never touch or overwrite it.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # Secrets are re-exported here through `tr -d '\r\n'` — pasting a
      # secret value from a browser can silently include a trailing
      # newline, which would otherwise break the multi-line commands
      # below (a stray newline mid-command turns the rest of the line
      # into a separate, invalid command — "No such file or directory").
      # Trimming here means the workflow keeps working even if a secret
      # has extra whitespace, instead of failing confusingly.
      - name: Load & sanitize deploy secrets
        run: |
          {
            echo "SSH_HOST=$(printf '%s' "${{ secrets.DEPLOY_SSH_HOST }}" | tr -d '\r\n ')"
            echo "SSH_USER=$(printf '%s' "${{ secrets.DEPLOY_SSH_USER }}" | tr -d '\r\n ')"
            echo "SSH_PORT=$(printf '%s' "${{ secrets.DEPLOY_SSH_PORT }}" | tr -d '\r\n ')"
            echo "HTDOCS_PATH=$(printf '%s' "${{ secrets.DEPLOY_HTDOCS_PATH }}" | tr -d '\r\n ')"
            echo "SERVER_PATH=$(printf '%s' "${{ secrets.DEPLOY_SERVER_PATH }}" | tr -d '\r\n ')"
          } >> "$GITHUB_ENV"

      - name: Trust remote host key
        run: |
          mkdir -p ~/.ssh
          # ssh-keyscan can exit non-zero even after successfully writing
          # host keys (e.g. it times out on one key algorithm but not
          # others) — `|| true` stops that from killing the whole job
          # via the shell's default `set -e`, since what matters is that
          # known_hosts actually got populated, not this exact exit code.
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts || true
          # Fail loudly (instead of silently continuing to a confusing
          # rsync/ssh error later) only if known_hosts is still empty —
          # that's the real failure signal, not ssh-keyscan's exit code.
          test -s ~/.ssh/known_hosts

      # -rlptz (NOT -a/-avz): archive mode (-a) implies preserving owner
      # and group (-o -g), which requires either root or already owning
      # the remote files — since the SSH deploy user isn't the same
      # user that owns the existing htdocs files, rsync would copy every
      # file's content fine but fail to chown/chgrp them, exiting with
      # "some files/attrs were not transferred (code 23)" even though
      # nothing was actually lost. Dropping -o/-g (owner/group) avoids
      # that class of failure entirely; -rlptz keeps recursion, symlinks,
      # permissions, timestamps, and compression.
      - name: Sync frontend build to htdocs
        run: rsync -rlptzv --delete -e "ssh -p ${SSH_PORT:-22}" ./dist/ "$SSH_USER@$SSH_HOST:$HTDOCS_PATH/"

      # No --delete here: .env, data.sqlite*, and uploads/ live only on
      # the VPS (never in git), so a destructive sync would wipe them.
      - name: Sync backend code (outside htdocs)
        run: |
          rsync -rlptzv \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'data.sqlite' \
            --exclude 'data.sqlite-*' \
            --exclude 'uploads' \
            -e "ssh -p ${SSH_PORT:-22}" \
            ./server/ "$SSH_USER@$SSH_HOST:$SERVER_PATH/"

      - name: Install backend deps & restart PM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_SERVER_PATH }}"
            npm install --omit=dev
            pm2 restart dramatv-api || pm2 start ecosystem.config.cjs
            pm2 save
